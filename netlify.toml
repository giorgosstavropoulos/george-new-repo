[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

[[headers]]
  for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'self' 'unsafe-inline' https://bjvptriklwrmcritiqcz.supabase.co; img-src 'self' data: https://bjvptriklwrmcritiqcz.supabase.co;"

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
